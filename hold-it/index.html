<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hold It! Assets</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, Arial, sans-serif;
            background: #101827;
            color: #f8fafc;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 10%, rgba(250, 204, 21, 0.22), transparent 24rem),
                radial-gradient(circle at 80% 30%, rgba(34, 197, 94, 0.16), transparent 22rem),
                #101827;
        }

        main {
            width: min(980px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(38px, 7vw, 72px);
            line-height: 0.95;
        }

        p {
            max-width: 680px;
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.55;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
            margin-top: 32px;
        }

        .asset-card {
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.72);
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        }

        .preview {
            display: grid;
            min-height: 180px;
            place-items: center;
            padding: 18px;
            background:
                linear-gradient(45deg, rgba(255, 255, 255, 0.08) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, 0.08) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.08) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.08) 75%);
            background-color: #1e293b;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
            background-size: 20px 20px;
        }

        .preview img {
            max-width: 100%;
            max-height: 190px;
            object-fit: contain;
        }

        .asset-info {
            padding: 14px;
        }

        .asset-name {
            margin-bottom: 10px;
            font-weight: 800;
            word-break: break-word;
        }

        .asset-link {
            display: block;
            color: #93c5fd;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <main>
        <h1>Hold It! Assets</h1>
        <p>
            Static asset host for the Hold It! game. After this folder is published with GitHub Pages,
            use the direct image URLs below in the game or in Astrocade asset references.
        </p>
        <section class="grid" id="asset-grid" aria-label="Hosted assets"></section>
    </main>

    <script>
        const assets = [
            'generated_assets/hold_it_logo.png',
            'generated_assets/hold_it_cover_style_platform_2d_polished_original_size.png',
            'generated_assets/hold_it_cover_style_wood_plank_2d_polished_original_size.png',
        ];

        const grid = document.getElementById('asset-grid');
        const baseUrl = new URL('.', window.location.href);

        grid.innerHTML = assets.map((path) => {
            const url = new URL(path, baseUrl).href;
            const name = path.split('/').pop();
            return `
                <article class="asset-card">
                    <div class="preview">
                        <img src="${path}" alt="${name}">
                    </div>
                    <div class="asset-info">
                        <div class="asset-name">${name}</div>
                        <a class="asset-link" href="${path}">${url}</a>
                    </div>
                </article>
            `;
        }).join('');
    </script>
</body>
</html>
